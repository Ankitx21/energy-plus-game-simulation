<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>3D scene test</title>
<!-- Developer page: renders one design full-screen for checking and screenshots.
     Example: dev/scene.html?wall=aac&shading=louvres&pv=60&cam=19,12,21 -->
<style>html,body{margin:0;height:100%;background:#bcdcf3}#v{position:fixed;inset:0}#info{position:fixed;left:8px;top:8px;font:13px system-ui;background:#fffc;padding:6px 8px;border-radius:6px}</style>
<script type="importmap">{ "imports": { "three": "../vendor/three.module.min.js" } }</script>
</head>
<body>
<div id="v"></div><div id="info">loading…</div>
<script type="module">
import { createScene } from '../js/scene3d.js';
const meta = await fetch('../data/blr.json').then(r => r.json());
const q = new URLSearchParams(location.search);
const design = { ...meta.base_design, ac: '3star', pv: 0 };
for (const [k, v] of q) if (k in design) design[k] = k === 'pv' ? +v : v;
let shadowText = '';
const s = createScene(document.getElementById('v'), meta, { preserveDrawingBuffer: true, still: true,
  onShadow: sh => { shadowText = !sh ? '' : sh.night ? 'sun down' : `shadow ${sh.pct.toFixed(0)}% (` + Object.values(sh.byFacade).map(f => f.compass + ' ' + f.pct.toFixed(0)).join(', ') + ')'; } });
if (q.get('cam')) s.camera.position.set(...q.get('cam').split(',').map(Number));
if (q.get('target')) s.controls.target.set(...q.get('target').split(',').map(Number));
if (q.get('sun')) s.setSun(...q.get('sun').split(',').map(Number));
if (q.get('month')) {
  const { sunPosition, sunPath, DAY_OF_MONTH } = await import('../js/sun.js');
  const m = +q.get('month'), h = +(q.get('time') || 12);
  s.setSunPath(sunPath(m, DAY_OF_MONTH, meta.city));
  const p = sunPosition(m, DAY_OF_MONTH, h, meta.city); s.setSun(p.azimuth, p.elevation);
}
s.update(design, { acUnits: +(q.get('ac') ?? 2) });
if (q.get('view')) { s.setView(q.get('view'), { instant: true }); }
if (q.get('quality')) s.setQuality(q.get('quality'));
if (q.get('heat')) {  // ?heat=arrows or heatmap or both: needs the table to look up the design
  const { loadCity } = await import('../js/data.js');
  const city = await loadCity('blr', '../');
  s.setHeat(city.lookup(design));
  s.setOverlays({ arrows: q.get('heat').includes('arrows'), heatmap: q.get('heat').includes('heatmap') });
}
if (q.has('wwr')) s.setOverlays({ wwr: true });  // ?wwr: window-ratio labels on each facade
s.renderNow();
document.getElementById('info').textContent = Object.entries(design).map(([k, v]) => `${k}=${v}`).join(' ') + ` | sun az ${s.sunState.azimuth.toFixed(1)} el ${s.sunState.elevation.toFixed(1)} | ${shadowText}`;
document.title = 'ready';
</script>
</body>
</html>
